<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>تسجيل الدخول - Edrak</title>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="auth.css"
>

</head>

<body>

<div class="auth-page">

    <div class="auth-glow"></div>

    <div class="auth-card">

        <div class="auth-logo">
            E
        </div>

        <h1>
            أهلاً بيك في Edrak
        </h1>

        <p>
            سجل دخولك وابدأ تجربتك
        </p>

        <form id="loginForm">

            <label>
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required
            >

            <label>
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                placeholder="••••••••"
                required
            >

            <button
                type="submit"
            >
                تسجيل الدخول
            </button>

        </form>

        <div
            class="error"
            id="error"
        ></div>

        <div class="auth-footer">

            معندكش حساب؟

            <a href="register.html">
                إنشاء حساب
            </a>

        </div>

    </div>

</div>

<script src="auth.js"></script>

</body>
</html>
<script src="config.js"></script>
<script src="auth.js"></script>
